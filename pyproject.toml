[project]
name = "neetpg-college-finder"
version = "1.0.0"
description = "NEET PG Rank Predictor & College Recommender with ML pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "numpy==2.1.3",
    "scipy==1.16.3",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
    "prometheus-client==0.26.0",
    "python-multipart==0.0.22"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.27.2"
]

